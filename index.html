<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK CALLZY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #05060a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 0% 0%, rgba(0, 255, 255, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 200, 0.15), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(100, 0, 255, 0.08), transparent 70%);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .brand-mini {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-weight: 700;
        }

        .back-btn {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            letter-spacing: 2px;
            transition: 0.3s;
            display: none;
        }
        .back-btn.show { display: block; }
        .back-btn:hover {
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* ============ WELCOME ============ */
        #view-welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
        }

        .welcome-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #00ffff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 60px;
            font-family: 'Orbitron', sans-serif;
        }

        .choose-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .choose-card {
            background: rgba(10, 10, 20, 0.8);
            border: 1.5px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 30px 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .choose-card:active { transform: scale(0.97); }

        .choose-card.buyer { border-color: rgba(0, 255, 255, 0.3); }
        .choose-card.buyer:hover {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .choose-card.admin { border-color: rgba(255, 0, 200, 0.3); }
        .choose-card.admin:hover {
            border-color: #ff00c8;
            box-shadow: 0 0 30px rgba(255, 0, 200, 0.5);
        }

        .choose-icon {
            font-size: 42px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .choose-card.buyer .choose-icon { color: #00ffff; }
        .choose-card.admin .choose-icon { color: #ff00c8; }

        .choose-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
        }

        .choose-desc {
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* ============ MODAL LOGIN ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: rgba(10, 10, 20, 0.98);
            border: 1.5px solid #ff00c8;
            border-radius: 12px;
            padding: 30px 25px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 0 50px rgba(255, 0, 200, 0.3);
            text-align: center;
        }
        .modal-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 3px;
            color: #ff00c8;
            text-shadow: 0 0 15px rgba(255, 0, 200, 0.6);
            font-weight: 700;
        }
        .modal-box input {
            width: 100%;
            padding: 13px;
            background: rgba(0,0,0,0.5);
            border: 1.5px solid rgba(255, 0, 200, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            font-weight: 600;
        }
        .modal-box input:focus {
            border-color: #ff00c8;
            box-shadow: 0 0 20px rgba(255, 0, 200, 0.5);
        }
        .modal-box button {
            width: 100%;
            padding: 13px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        .btn-login {
            background: linear-gradient(90deg, #ff00c8, #00ffff);
            color: #000;
            border: none;
        }
        .btn-login:hover {
            box-shadow: 0 0 25px rgba(255, 0, 200, 0.7);
            transform: scale(1.02);
        }
        .btn-cancel {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
        }
        .btn-cancel:hover {
            border-color: #ff00c8;
            color: #ff00c8;
        }
        .error-msg {
            color: #ff3355;
            font-size: 11px;
            margin-bottom: 10px;
            min-height: 16px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* ============ MAIN MENU ============ */
        #view-main {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .profile-pic-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .profile-pic-wrap::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00ffff, #ff00c8, #00ffff);
            animation: spin 4s linear infinite;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.7;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            overflow: hidden;
            cursor: default;
            border: 2px solid #0a0a12;
        }
        body.admin-mode .profile-pic { cursor: pointer; }

        .profile-pic img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }
        .profile-pic input[type="file"] { display: none; }

        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            text-align: center;
            background: linear-gradient(90deg, #00ffff, #ff00c8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            outline: none;
            padding: 5px 15px;
            transition: 0.3s;
        }
        body.admin-mode .profile-name {
            border: 1px dashed rgba(0, 255, 136, 0.5);
            border-radius: 5px;
            cursor: text;
        }

        .profile-sub {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            padding: 3px 10px;
        }
        body.admin-mode .profile-sub {
            border: 1px dashed rgba(0, 255, 136, 0.4);
            border-radius: 4px;
            cursor: text;
        }

        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-menu {
            background: rgba(10, 10, 20, 0.8);
            color: #fff;
            border: 1.5px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 22px 20px;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .btn-menu:hover {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        .btn-menu:nth-child(2):hover {
            border-color: #ff00c8;
            box-shadow: 0 0 25px rgba(255, 0, 200, 0.4);
        }
        .btn-menu:active { transform: scale(0.97); }

        /* ============ STOCK GRID ============ */
        #view-stock { display: none; width: 100%; }

        .header-stock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            font-weight: 700;
        }

        .btn-dots {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            display: none;
            padding: 0 10px;
        }
        body.admin-mode .btn-dots { display: block; }
        .btn-dots:hover { text-shadow: 0 0 15px #fff; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: rgba(10, 10, 20, 0.98);
            border: 1.5px solid #00ffff;
            border-radius: 8px;
            padding: 8px;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            min-width: 200px;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu button {
            display: block;
            background: transparent;
            color: #fff;
            border: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 15px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            border-radius: 5px;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .dropdown-menu button:hover {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .stock-item {
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: 0.3s;
            background-color: rgba(10, 10, 20, 0.7);
            overflow: hidden;
        }
        .stock-item::before {
            content: "X";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: rgba(255,255,255,0.05);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            z-index: 1;
        }
        .stock-item.has-image::before { display: none; }

        .stock-item::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .stock-item:hover {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        .stock-label {
            position: relative;
            z-index: 2;
            padding: 12px 10px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        /* ============ DETAIL ============ */
        #view-detail {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .detail-image-box {
            width: 100%;
            height: 420px;
            border: 1.5px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            margin-bottom: 25px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            color: rgba(255,255,255,0.05);
            background-color: rgba(10, 10, 20, 0.6);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
        }
        .detail-image-box.has-image { color: transparent; }

        .btn-order {
            background: linear-gradient(90deg, #00ffff, #ff00c8);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 18px 60px;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 4px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .btn-order:hover {
            box-shadow: 0 0 50px rgba(255, 0, 200, 0.7);
            transform: scale(1.05);
        }

        /* ============ BADGE ADMIN ============ */
        .admin-active-badge {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.15);
            border: 1.5px solid #00ff88;
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            font-weight: 700;
            z-index: 998;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
            backdrop-filter: blur(10px);
        }
        .admin-active-badge.show { display: block; }

    </style>
</head>
<body>

    <div class="app-container">

        <div class="top-bar">
            <div class="brand-mini">CALLZY.STORE</div>
            <button class="back-btn" id="backBtn">← BACK</button>
        </div>

        <!-- WELCOME -->
        <div id="view-welcome">
            <div class="welcome-logo">CALLZY</div>
            <div class="welcome-sub">PREMIUM STOCK</div>

            <div class="choose-grid">
                <div class="choose-card buyer" id="btnBuyer">
                    <div class="choose-icon">👤</div>
                    <div class="choose-title">BUYER</div>
                    <div class="choose-desc">LIHAT STOCK<br>& ORDER</div>
                </div>

                <div class="choose-card admin" id="btnAdmin">
                    <div class="choose-icon">🔐</div>
                    <div class="choose-title">ADMIN</div>
                    <div class="choose-desc">LOGIN UNTUK<br>EDIT</div>
                </div>
            </div>
        </div>

        <!-- MAIN MENU -->
        <div id="view-main">
            <div class="profile-section">
                <div class="profile-pic-wrap">
                    <label class="profile-pic" for="profile-upload">
                        <span id="profile-placeholder">😊</span>
                        <img id="profile-img" src="" alt="Profile">
                        <input type="file" id="profile-upload" accept="image/*" disabled>
                    </label>
                </div>
                <h1 class="profile-name" id="profile-name-display" contenteditable="false">CALLZY</h1>
                <div class="profile-sub" id="profile-sub" contenteditable="false">PREMIUM STOCK</div>
            </div>
